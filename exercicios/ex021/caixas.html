<!DOCTYPE html>
<html lang="pt- br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=width, initial-scale=1.0">
    <title> Modewlo de Caixas</title>
    <style>
        h1 {
            background-color: rgb(208, 191, 124);
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkblue;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding: left 10px;
        }

        a {
            border-width: 10px;
            border-style: solid;
            border-color: rgb(139, 0, 0);

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding: left 10px;
        }
    </style>
</head>
<body>
    <h1> Exemplo de caiza BOX-LEVEL</h1>
    <p>Parágragos também são exemplos de box-leve, mas os <a href="#">Links são exemplos de caixas inline-level. </a></p>
</body>
</html>
